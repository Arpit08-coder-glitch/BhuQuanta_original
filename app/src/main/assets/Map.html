let currentMarker = null;
let isNavigating = false; // Flag to track navigation status

function addCurrentLocationMarker(map) {
    if (!navigator.geolocation) {
        console.error("Geolocation is not supported by this browser.");
        return;
    }

    let firstUpdate = true;

    function updateLocation() {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                // Choose the appropriate icon
                const locationIcon = L.divIcon({
                    className: 'custom-fa-icon',
                    html: isNavigating
                        ? '<i class="fas fa-location-arrow" style="color: blue;"></i>'  // New icon for navigation
                        : '<i class="fas fa-map-marker-alt" style="color: red;"></i>', // Default icon
                    iconSize: [30, 30],
                    iconAnchor: [15, 30]
                });

                // Remove the old marker
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }

                // Add the new marker
                currentMarker = L.marker([latitude, longitude], { icon: locationIcon })
                    .addTo(map);

                // Set the view only on the first update
                if (firstUpdate) {
                    map.setView([latitude, longitude], 15);
                    firstUpdate = false;
                }
            },
            (error) => {
                console.error("Error getting location:", error);
            }
        );
    }

    // Update location every second
    updateLocation();
    setInterval(updateLocation, 1000);
}

// Function to populate a select element with options
function populateSelect(selectId, options) {
    const select = document.getElementById(selectId);
    select.innerHTML = ''; // Clear existing options
    const defaultOption = document.createElement('option');
    defaultOption.textContent = `Select ${selectId.charAt(0).toUpperCase() + selectId.slice(1)}`;
    select.appendChild(defaultOption);
    options.forEach(option => {
        const optionElement = document.createElement('option');
        optionElement.value = option;
        optionElement.textContent = option;
        select.appendChild(optionElement);
    });
}

// Function to show progress bar

// Function to hide progress bar

// Function to show error toast
function showErrorToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// Function to fetch tehsils based on selected district
async function fetchTehsils(district) {
    showProgressBar('tehsil');
    const layer = district === 'Churu' ? 'ne:Bidasar' : 'ne:Bidasar';
    const geoserverUrl = `http://gs.quantasip.com/geoserver/ne/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=${layer}&outputFormat=application%2Fjson`;

    const url = `http://3.109.124.23:3000/proxy?url=${encodeURIComponent(geoserverUrl)}`;
    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.features && data.features.length > 0) {
            const tehsils = new Set();
            data.features.forEach(feature => tehsils.add(feature.properties.tehsil));

            populateSelect('tehsil', Array.from(tehsils));
        }
    } catch (error) {
        console.error('Error fetching tehsils:', error);
        showErrorToast('Error fetching tehsils.');
    } finally {
        hideProgressBar('tehsil');
    }
}

// Function to fetch villages based on selected tehsil and district
async function fetchVillages(district, tehsil) {
    populateSelect('village', []);
    showProgressBar('village');

    const layer = tehsil === 'Bidasar' ? 'ne:Bidasar' : 'ne:Sujangarh';
    const geoserverUrl = `http://gs.quantasip.com/geoserver/ne/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=${layer}&outputFormat=application%2Fjson`;

    const url = `http://3.109.124.23:3000/proxy?url=${encodeURIComponent(geoserverUrl)}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.features && data.features.length > 0) {
            const villages = new Set();
            data.features.forEach(feature => villages.add(feature.properties.village));

            // Convert Set to Array and sort in ascending order
            const sortedVillages = Array.from(villages).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));

            populateSelect('village', sortedVillages);
        }
    } catch (error) {
        console.error('Error fetching villages:', error);
        showErrorToast('Error fetching villages.');
    } finally {
        hideProgressBar('village');
    }
}

// Function to fetch khasra numbers based on selected village, tehsil, and district
async function fetchKhasras(district, tehsil, village) {
    showProgressBar('khasra_no');

    const layer = tehsil === 'Bidasar' ? 'ne:Bidasar' : 'ne:Sujangarh';
    const geoserverUrl = `http://gs.quantasip.com/geoserver/ne/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=${layer}&outputFormat=application%2Fjson&cql_filter=village='${village}'`;

    const url = `http://3.109.124.23:3000/proxy?url=${encodeURIComponent(geoserverUrl)}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.features && data.features.length > 0) {
            const khasras = new Set();
            data.features.forEach(feature => khasras.add(feature.properties.khasra_no));

            // Convert Set to Array and sort khasra numbers correctly
            const sortedKhasras = Array.from(khasras).sort((a, b) => {
                // Extract numbers for sorting while keeping fractional parts in order
                const numA = a.split('/').map(Number);
                const numB = b.split('/').map(Number);

                if (numA[0] !== numB[0]) {
                    return numA[0] - numB[0]; // Compare main numbers
                }
                return (numA[1] || 0) - (numB[1] || 0); // Compare fractional parts
            });

            populateSelect('khasra_no', sortedKhasras);
        }
    } catch (error) {
        console.error('Error fetching khasra numbers:', error);
        showErrorToast('Error fetching khasra numbers.');
    } finally {
        hideProgressBar('khasra_no');
    }
}

let currentPolygonGroup = null;
let currentPolygonLayerAmravati = null;

// Function to handle search button click
document.getElementById('search-btn').addEventListener('click', async function () {
    const district = document.getElementById('district').value;
    const tehsil = document.getElementById('tehsil').value;
    village = document.getElementById('village').value;
    const khasraNo = document.getElementById('khasra_no').value; // Get Khasra Number

    // Remove current polygon layers (if any) when search button is clicked
    if (currentPolygonLayerAmravati) {
        map.removeLayer(currentPolygonLayerAmravati);
        currentPolygonLayerAmravati = null;
    }
    if (currentPolygonLayerAkola) {
        map.removeLayer(currentPolygonLayerAkola);
        currentPolygonLayerAkola = null;
    }

    // Remove the previous WMS layer before adding a new one
    if (currentWMSLayer) {
        map.removeLayer(currentWMSLayer);
        currentWMSLayer = null;
    }

    if (!district || !tehsil || !village || !khasraNo) {
        return;
    }
    // Escape single quotes in village and khasra number for CQL filter
    const escapedVillage = village.replace(/'/g, "''");
    const escapedKhasraNo = khasraNo.replace(/'/g, "''");

    // Construct the GetFeatureInfo URL based on selected values
    const geoserverUrl = `http://gs.quantasip.com/geoserver/ne/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=${tehsil === 'Bidasar' ? 'ne:Bidasar' : 'ne:Sujangarh'}&outputFormat=application%2Fjson&cql_filter=district='${district}' AND tehsil='${tehsil}' AND village='${escapedVillage}' AND khasra_no='${escapedKhasraNo}'`;
    // Proxy URL
    const url = `http://3.109.124.23:3000/proxy?url=${encodeURIComponent(geoserverUrl)}`;
    try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.features && data.features.length > 0) {
            // Remove the previous polygon group if it exists
            if (currentPolygonGroup) {
                map.removeLayer(currentPolygonGroup);
                currentPolygonGroup = null;
            }
            // Create a new group to hold all the polygon layers
            let polygonGroup = L.layerGroup();
            let bounds = L.latLngBounds();  // Initialize an empty bounds object
            // Filter all features that match the district, tehsil, village, and khasra number
            const matchingFeatures = data.features.filter((feature) => {
                const properties = feature.properties;
                return properties.district === district && properties.tehsil === tehsil && properties.village === village && properties.khasra_no === khasraNo;
            });

            // Add each matching feature to the map
            matchingFeatures.forEach((feature) => {
                const polygonLayer = L.geoJSON(feature.geometry);
                polygonGroup.addLayer(polygonLayer);
                // Extend the bounds to include this polygon's bounds
                bounds.extend(polygonLayer.getBounds());
            });

            // Zoom to the bounds of all the polygons
            map.fitBounds(bounds);
            // Store the current polygon group for future removal
            currentPolygonGroup = polygonGroup;
            currentPolygonGroup.addTo(map);

            // Add WMS layer for the selected district
            currentWMSLayer = L.tileLayer.wms('http://gs.quantasip.com/geoserver/ne/wms', {
                layers: `ne:${tehsil}`, // Use district name as layer name
                format: 'image/png',
                transparent: true,
                CQL_FILTER: `village='${escapedVillage}'` // Show only selected village and khasra number
            }).addTo(map);
            // Set WMS layer zIndex to ensure it appears above base layers
            currentWMSLayer.setZIndex(400);
            currentWMSLayer.setMaxZoom(80);
        } else {
            console.log('No features found for the selected district, tehsil, village, and khasra number.');
        }
    } catch (error) {
        console.error('Error fetching feature info:', error);
    }
});

function findNearestPolygon(userLatLng, geoJsonLayers) {
    let minDistance = Infinity;
    let nearestCentroid = null;

    geoJsonLayers.forEach((layer, index) => {
        console.log(`Checking layer ${index}:`, layer);

        if (layer) {
            layer.eachLayer(function (polygon) {
                if (polygon instanceof L.Polygon) {
                    console.log("Polygon found:", polygon);
                    let latlngs = polygon.getLatLngs();

                    // Flatten array in case of MultiPolygon
                    latlngs = latlngs.flat(2);

                    console.log("Extracted Polygon Coordinates:", latlngs);

                    // Compute centroid
                    let centroid = computeCentroid(latlngs);

                    if (centroid) {
                        let distance = userLatLng.distanceTo(centroid);
                        console.log(`Distance to centroid (${centroid.lat}, ${centroid.lng}):`, distance);

                        if (distance < minDistance) {
                            minDistance = distance;
                            nearestCentroid = centroid;
                        }
                    }
                } else {
                    console.log("Skipping non-polygon layer:", polygon);
                }
            });
        } else {
            console.log("Skipping null layer.");
        }
    });

    console.log("Nearest centroid found:", nearestCentroid);
    return nearestCentroid;
}
function drawShortestRoute(start, end) {
    if (typeof L.Routing === "undefined") {
        console.error("Leaflet Routing Machine is not loaded.");
        return;
    }
    // Remove existing route
    if (window.routingControl) {
        map.removeControl(window.routingControl);
    }
    // Create new route with no markers and no text instructions
    window.routingControl = L.Routing.control({
        waypoints: [start, end],
        routeWhileDragging: true,
        createMarker: function () { return null; }, // No markers at start/end
        show: false, // Hide instructions
        lineOptions: {
            styles: [{ color: 'blue', weight: 5, opacity: 0.7 }]
        }
    }).addTo(map);
    routingControl.on("routesfound", function (e) {
        let route = e.routes[0];
        let bounds = L.latLngBounds(route.coordinates);
        map.fitBounds(bounds);
    });
}
function computeCentroid(latlngs) {
    let sumLat = 0, sumLng = 0, count = latlngs.length;

    if (count === 0) return null;

    latlngs.forEach(point => {
        sumLat += point.lat;
        sumLng += point.lng;
    });

    return L.latLng(sumLat / count, sumLng / count);
}
